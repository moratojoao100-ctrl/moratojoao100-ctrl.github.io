<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade 1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f3f7fb;
        color: #1e293b;
        line-height: 1.6;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin-bottom: 1rem;
      }
      a {
        color: #0d6efd;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .button-link {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.2rem;
        border-radius: 10px;
        background: #0d6efd;
        color: #ffffff;
        text-decoration: none;
      }
      .button-link:hover {
        background: #0b5ed7;
      }
      @media (max-width: 600px) {
        body {
          margin: 12px;
        }
        .container {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Atividade 1</h1>
      <p>Projeto criado para a atividade.</p>
      <a href="atividade 1.html" class="button-link">Abrir o arquivo da atividade</a>
    </div>
  </body>
</html>
